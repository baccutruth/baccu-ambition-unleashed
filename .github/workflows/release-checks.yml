name: BACCU release checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-release-checks:
    name: Static release checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check spanixpress.js
      - name: Check interaction test syntax
        run: node --check scripts/interaction-check.mjs
      - name: Validate static site and PWA assets
        run: node scripts/qa-check.mjs
      - name: Test filters, search, prompt builder and clipboard
        run: node scripts/interaction-check.mjs
